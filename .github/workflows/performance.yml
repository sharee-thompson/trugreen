name: Performance Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the normal audit, capture a baseline snapshot, or rebuild reports only
        required: true
        type: choice
        default: audit
        options:
          - audit
          - capture-baseline
          - rebuild-report
      page_scope:
        description: Preset page scope for baseline capture so you do not need to type page keys
        required: false
        type: choice
        default: default-audit
        options:
          - default-audit
          - all-configured
          - sampling
          - core
          - landing-pages
          - lawn-care-plans
          - service-pages
          - branch-samples
          - content-pages
          - support
          - blog
      page_keys:
        description: Optional comma-separated page keys for baseline capture; leave alone when using a page scope preset
        required: false
        type: string
        default: ""
      baseline_name:
        description: Baseline milestone name used when capturing a baseline
        required: false
        type: string
        default: pre-trugreen-dev-updates
      approve_baseline:
        description: Promote the captured baseline in the same workflow run
        required: false
        type: boolean
        default: true

  schedule:
    # Runs weekly on Monday at 9:20 AM Central during daylight saving time.
    # GitHub cron uses UTC.
    - cron: "30 4 * * 1"

permissions:
  contents: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  performance-audit:
    name: Run Performance Audit
    timeout-minutes: 480
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 1

      - name: Restore existing dashboard contents
        run: |
          mkdir -p dashboard
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git --work-tree=dashboard checkout origin/gh-pages -- .
          fi

      - name: Restore prior performance history
        run: |
          mkdir -p performance-report
          mkdir -p performance-baselines

          if [ -f "dashboard/performance/performance-report/performance-history-seconds.csv" ]; then
            cp dashboard/performance/performance-report/performance-history-seconds.csv performance-report/performance-history-seconds.csv
          fi

          if [ -f "dashboard/performance/performance-baselines/approved-baselines.json" ]; then
            cp dashboard/performance/performance-baselines/approved-baselines.json performance-baselines/approved-baselines.json
          fi

      - name: Setup Node
        uses: actions/setup-node@v4.0.1
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'rebuild-report' }}
        run: npx playwright install --with-deps

      - name: Run performance audit
        id: run-performance-audit
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'audit' }}
        run: npm run performance:audit -- --workers=2
        env:
          LIGHTHOUSE_AUDIT_SAMPLES: "2"
          LIGHTHOUSE_TEST_TIMEOUT_MS: "1800000"
          LIGHTHOUSE_THROTTLING_METHOD: "simulate"
          PERFORMANCE_PAGE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.page_scope || '' }}
          PERFORMANCE_PAGE_KEYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.page_keys || '' }}
        continue-on-error: true

      - name: Capture performance baseline
        id: capture-performance-baseline
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'capture-baseline' }}
        run: npm run performance:audit -- --workers=1
        env:
          LIGHTHOUSE_AUDIT_SAMPLES: "3"
          LIGHTHOUSE_TEST_TIMEOUT_MS: "1800000"
          LIGHTHOUSE_THROTTLING_METHOD: "simulate"
          PERFORMANCE_PAGE_SCOPE: ${{ github.event.inputs.page_scope }}
          PERFORMANCE_PAGE_KEYS: ${{ github.event.inputs.page_keys }}
          PERFORMANCE_WRITE_BASELINE_CANDIDATE: "true"
          PERFORMANCE_BASELINE_NAME: ${{ github.event.inputs.baseline_name }}
        continue-on-error: true

      - name: Approve captured baseline
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'capture-baseline' && github.event.inputs.approve_baseline == 'true' }}
        env:
          PERFORMANCE_BASELINE_NAME: ${{ github.event.inputs.baseline_name }}
        run: node scripts/approve-performance-baseline.js

      - name: Build performance dashboard
        if: always()
        run: npm run performance:report

      - name: Save performance report for dashboard
        if: always()
        run: |
          rm -rf dashboard/performance/performance-report
          mkdir -p dashboard/performance
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"}" > dashboard/performance/last-run.json
          if [ -d "performance-report" ]; then
            cp -R performance-report dashboard/performance/performance-report
          fi
          if [ -d "performance-baselines" ]; then
            rm -rf dashboard/performance/performance-baselines
            cp -R performance-baselines dashboard/performance/performance-baselines
          fi
          if [ -d "playwright-report" ]; then
            rm -rf dashboard/performance/playwright-report
            cp -R playwright-report dashboard/performance/playwright-report
          fi

      - name: Build dashboard homepage
        if: always()
        run: node scripts/build-dashboard-index.js

      - name: Upload performance report artifact
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: performance-report
          path: performance-report/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload performance baselines artifact
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: performance-baselines
          path: performance-baselines/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload performance Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: performance-playwright-report
          path: playwright-report/
          retention-days: 1
          if-no-files-found: warn

      - name: Upload performance JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: performance-json-report
          path: playwright-report.json
          retention-days: 1
          if-no-files-found: warn

      - name: Clean up old reports
        if: always()
        run: bash scripts/cleanup-old-reports.sh

      - name: Publish performance report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dashboard
          keep_files: true

      - name: Fail if baseline capture had test errors
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'capture-baseline' && steps.capture-performance-baseline.outcome == 'failure' }}
        run: |
          echo "Baseline capture completed with one or more test failures. Approved baselines were still published for pages that produced candidates."
          exit 1

